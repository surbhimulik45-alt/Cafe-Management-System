<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition & Calorie Guide - Cafe Delight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="index.html">☕ Cafe Delight</a>
        <div class="d-flex align-items-center gap-3">
            <a href="menu.html" class="nav-link text-white">Menu</a>
            <a href="cart.html" class="btn btn-warning position-relative">
                <i class="fa-solid fa-cart-shopping"></i> Cart
                <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
            </a>
            <div id="navDashboardItem" style="display:none;" class="ms-2">
                <a href="#" id="navDashboardLink" class="nav-link text-warning fw-bold">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
            </div>
            <a id="navLoginBtn" class="btn btn-outline-warning btn-sm ms-2" href="login.html">Login</a>

        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-dark">🥗 Nutritional Facts & Calorie Counter</h1>
        <p class="lead text-muted">Stay healthy by knowing what's in your favorite food & drinks</p>
    </div>

    <div class="row justify-content-center g-4">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <label class="form-label fw-bold fs-5 text-dark mb-3">Select Food Item:</label>
                
                <select id="nutritionFoodSelect" class="form-select form-select-lg mb-4">
                    <!-- Dynamic nutrition items -->
                </select>

                <!-- Macro Cards -->
                <div class="row g-3 text-center mb-4">
                    <div class="col-6 col-md-3">
                        <div class="p-3 bg-danger bg-opacity-10 border border-danger rounded-3">
                            <i class="fa-solid fa-fire text-danger fa-2x mb-2"></i>
                            <h6 class="text-uppercase small text-muted mb-1">Calories</h6>
                            <h3 class="fw-bold text-danger mb-0" id="nutCalories">0</h3>
                            <span class="small text-muted">kcal</span>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 bg-primary bg-opacity-10 border border-primary rounded-3">
                            <i class="fa-solid fa-dumbbell text-primary fa-2x mb-2"></i>
                            <h6 class="text-uppercase small text-muted mb-1">Protein</h6>
                            <h3 class="fw-bold text-primary mb-0" id="nutProtein">0</h3>
                            <span class="small text-muted">grams</span>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 bg-warning bg-opacity-10 border border-warning rounded-3">
                            <i class="fa-solid fa-wheat-awn text-warning fa-2x mb-2"></i>
                            <h6 class="text-uppercase small text-muted mb-1">Carbs</h6>
                            <h3 class="fw-bold text-warning mb-0" id="nutCarbs">0</h3>
                            <span class="small text-muted">grams</span>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 bg-success bg-opacity-10 border border-success rounded-3">
                            <i class="fa-solid fa-droplet text-success fa-2x mb-2"></i>
                            <h6 class="text-uppercase small text-muted mb-1">Fat</h6>
                            <h3 class="fw-bold text-success mb-0" id="nutFat">0</h3>
                            <span class="small text-muted">grams</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted small">* Values are estimated per standard serving size.</span>
                    <a href="menu.html" class="btn btn-outline-warning">Order This Item →</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/nutrition.js"></script>
</body>
</html>
