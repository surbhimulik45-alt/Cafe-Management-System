<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Cafe Delight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="index.html">☕ Cafe Delight</a>
        <div class="d-flex align-items-center gap-3">
            <a href="menu.html" class="btn btn-outline-warning btn-sm">🍽 Continue Shopping</a>
        </div>
    
            <div id="navDashboardItem" style="display:none;" class="ms-2">
                <a href="#" id="navDashboardLink" class="nav-link text-warning fw-bold">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
            </div>
            <a id="navLoginBtn" class="btn btn-outline-warning btn-sm ms-2" href="login.html">Login</a>
</div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4">🛒 Shopping Cart</h2>

    <div class="row g-4" id="cartContentRow">
        <!-- Cart Items List -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-3 mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col" class="ps-4">Item</th>
                                    <th scope="col">Price</th>
                                    <th scope="col" class="text-center">Quantity</th>
                                    <th scope="col">Total</th>
                                    <th scope="col" class="text-end pe-4">Action</th>
                                </tr>
                            </thead>
                            <tbody id="cartItemsTable">
                                <!-- Dynamic Cart Items -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <a href="menu.html" class="btn btn-outline-secondary">← Back to Menu</a>
                <button id="clearCartBtn" class="btn btn-outline-danger">Clear Cart</button>
            </div>
        </div>

        <!-- Order Summary & Checkout -->
        <div class="col-lg-4">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4">
                    <h4 class="card-title fw-bold mb-3">Order Summary</h4>
                    
                    <div class="input-group mb-3">
                        <input type="text" id="couponCode" class="form-control" placeholder="Promo Code (e.g. CAFE20)">
                        <button id="applyCouponBtn" class="btn btn-dark">Apply</button>
                    </div>

                    <ul class="list-group list-group-flush mb-3">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent">
                            Subtotal
                            <span id="cartSubtotal" class="fw-semibold">₹0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent">
                            Discount
                            <span id="cartDiscount" class="text-success fw-semibold">-₹0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent">
                            Taxes (5% GST)
                            <span id="cartTax" class="fw-semibold">₹0</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 bg-transparent fs-5 fw-bold">
                            Grand Total
                            <span id="cartGrandTotal" class="text-success">₹0</span>
                        </li>
                    </ul>

                    <button id="checkoutBtn" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm">
                        Proceed to Checkout →
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
