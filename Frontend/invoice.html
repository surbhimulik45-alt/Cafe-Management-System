<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - Cafe Delight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff !important; }
        }
        .wheel-pointer {
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translate(-50%, 0); }
            to { transform: translate(-50%, -6px); }
        }
        .reward-unlocked {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); }
            50% { box-shadow: 0 0 20px rgba(40, 167, 69, 0.7); }
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div>
                        <h2 class="fw-bold text-warning mb-0">☕ Cafe Delight</h2>
                        <p class="text-muted small mb-0">Taste the best coffee & cafe foods</p>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-success fs-6">PAID</span>
                        <div class="small text-muted mt-1" id="invDate"></div>
                    </div>
                </div>

                <!-- Invoice Meta -->
                <div class="row mb-4">
                    <div class="col-6">
                        <h6 class="text-uppercase text-muted fw-bold small">Customer Details</h6>
                        <h5 class="fw-bold mb-1" id="invCustomerName">Customer</h5>
                        <p class="text-muted small mb-0" id="invCustomerEmail"></p>
                    </div>
                    <div class="col-6 text-end">
                        <h6 class="text-uppercase text-muted fw-bold small">Order Reference</h6>
                        <div class="fw-bold text-dark" id="invOrderId">Order #---</div>
                        <div class="small text-muted" id="invTxnId">TXN: ---</div>
                    </div>
                </div>

                <!-- Items Table -->
                <div class="table-responsive mb-4">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Item Description</th>
                                <th class="text-end">Price</th>
                            </tr>
                        </thead>
                        <tbody id="invItemsBody">
                            <!-- Items -->
                        </tbody>
                    </table>
                </div>

                <!-- Totals -->
                <div class="row justify-content-end mb-4">
                    <div class="col-md-6">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between px-0 bg-transparent">
                                <span>Subtotal:</span>
                                <span id="invSubtotal" class="fw-semibold">₹0</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between px-0 bg-transparent">
                                <span>GST (5%):</span>
                                <span id="invGst" class="fw-semibold">₹0</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between px-0 bg-transparent fs-5 fw-bold text-success">
                                <span>Total Paid:</span>
                                <span id="invTotal">₹0</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Spin the Wheel Section -->
                <div id="wheelContainerSection" class="border-top pt-4 mt-4 no-print text-center">
                    <h4 class="fw-bold text-dark mb-1">🎡 Order Reward Wheel</h4>
                    <p class="text-muted small mb-3" id="wheelNotice">Unlock reward wheel by placing order over ₹200</p>
                    
                    <div id="wheelGameWrapper" class="d-none mb-4">
                        <div class="position-relative d-inline-block mt-2">
                            <!-- Bouncing arrow indicating winner -->
                            <div class="wheel-pointer position-absolute top-0 start-50 translate-middle-x" style="z-index: 10; margin-top: -24px;">
                                <i class="fa-solid fa-caret-down text-danger fs-1"></i>
                            </div>
                            <canvas id="wheelCanvas" width="300" height="300" class="shadow-sm border rounded-circle"></canvas>
                        </div>
                        <div class="mt-3">
                            <button id="spinWheelBtn" class="btn btn-danger fw-bold px-4 py-2 shadow">
                                🎡 Spin the Wheel
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top no-print">
                    <a id="trackOrderBtn" href="tracking.html" class="btn btn-outline-dark">
                        <i class="fa-solid fa-truck me-1"></i> Track Order Live
                    </a>
                    <div>
                        <button onclick="window.print()" class="btn btn-warning fw-bold">
                            <i class="fa-solid fa-print me-1"></i> Print Invoice
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/invoice.js"></script>
</body>
</html>
