<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Delight - Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/menu.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold text-warning" href="index.html">
☕ Cafe Delight
</a>

<div class="d-flex align-items-center gap-3">
<a href="index.html" class="nav-link text-white me-2">Home</a>
<a href="offers.html" class="nav-link text-white me-2">Offers</a>
<a href="booking.html" class="nav-link text-white me-2">Book Table</a>
<a href="surprise.html" class="nav-link text-white me-2">Surprise Me 🎲</a>
<a href="cart.html" class="btn btn-warning position-relative">
<i class="fa-solid fa-cart-shopping"></i> Cart
<span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
</a>
            <div id="navDashboardItem" style="display:none;" class="ms-2">
                <a href="#" id="navDashboardLink" class="nav-link text-warning fw-bold">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
            </div>
            <a id="navLoginBtn" class="btn btn-outline-warning btn-sm ms-2" href="login.html">Login</a>

</div>
</div>
</nav>

<!-- Search -->

<div class="container mt-4">

<div class="row g-3">

<div class="col-md-8">

<input
type="text"
id="search"
class="form-control"
placeholder="Search Food...">

</div>

<div class="col-md-4">

<select
id="category"
class="form-select">

<option value="">All Categories</option>

<option value="Coffee">Coffee</option>

<option value="Burgers">Burgers</option>

<option value="Shakes">Shakes</option>

<option value="Mojitos">Mojitos</option>

<option value="Desserts">Desserts</option>

<option value="Pasta">Pasta</option>

<option value="Sandwiches">Sandwiches</option>

<option value="Lite Bites">Lite Bites</option>

</select>

</div>

</div>

</div>

<!-- Today's Offer -->

<div class="container mt-4">

<div class="alert alert-success">

🎉 <b>Today's Offer:</b>

Get 20% OFF on all Burgers!

</div>

</div>

<!-- Menu -->

<div class="container mt-4">

<div
class="row"
id="menuContainer">

</div>

</div>

<!-- Card Template -->

<template id="foodCard">

<div class="col-lg-4 col-md-6 mb-4">

<div class="card shadow h-100">

<img
class="card-img-top food-image"
height="220">

<div class="card-body">

<h5 class="food-name"></h5>

<p class="food-description text-muted"></p>

<h4 class="text-success">

₹<span class="food-price"></span>

</h4>

<hr>

<h6 class="text-primary">

Nutrition

</h6>

<ul>

<li>
Calories :
<span class="food-calories"></span>
</li>

<li>
Protein :
<span class="food-protein"></span> g
</li>

<li>
Carbs :
<span class="food-carbs"></span> g
</li>

<li>
Fat :
<span class="food-fat"></span> g
</li>

</ul>

<div class="d-grid gap-2">

<button
class="btn btn-warning add-cart">

🛒 Add To Cart

</button>

</div>

</div>

</div>

</div>

</template>

<footer
class="bg-dark text-center text-white mt-5 p-3">

© 2026 Cafe Delight

</footer>

<script src="js/api.js"></script>
<script src="js/menu.js"></script>

</body>

</html>
