<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - Cafe Delight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="index.html">☕ Cafe Delight</a>
        <div class="d-flex align-items-center gap-3">
            <a href="menu.html" class="nav-link text-white">Menu</a>
            <a href="cart.html" class="btn btn-warning position-relative">
                <i class="fa-solid fa-cart-shopping"></i> Cart
                <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
            </a>
            <div id="navDashboardItem" style="display:none;" class="ms-2">
                <a href="#" id="navDashboardLink" class="nav-link text-warning fw-bold">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
            </div>
            <a id="navLoginBtn" class="btn btn-outline-warning btn-sm ms-2" href="login.html">Login</a>

        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-dark">⭐ Customer Reviews</h1>
        <p class="lead text-muted">Read what our happy foodies have to say about Cafe Delight</p>
    </div>

    <div class="row g-4 mb-5">
        <!-- Review Form -->
        <div class="col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <h4 class="fw-bold text-warning mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>Write a Review</h4>
                <form id="reviewForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Dish</label>
                        <select id="reviewMenuSelect" class="form-select" required>
                            <!-- Dynamic menu items -->
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Rating</label>
                        <select id="reviewRatingSelect" class="form-select" required>
                            <option value="5">⭐⭐⭐⭐⭐ (5 / 5)</option>
                            <option value="4">⭐⭐⭐⭐ (4 / 5)</option>
                            <option value="3">⭐⭐⭐ (3 / 5)</option>
                            <option value="2">⭐⭐ (2 / 5)</option>
                            <option value="1">⭐ (1 / 5)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Your Review</label>
                        <textarea id="reviewText" class="form-control" rows="4" placeholder="Share your dining experience..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm">
                        Submit Review
                    </button>
                </form>
            </div>
        </div>

        <!-- Reviews Grid -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-comments me-2 text-warning"></i>Recent Reviews</h4>
                <div id="reviewsList" class="row g-3">
                    <!-- Dynamic review cards -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/reviews.js"></script>
</body>
</html>
