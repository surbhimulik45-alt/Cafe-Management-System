<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Cafe Delight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-warning" href="index.html">☕ Cafe Delight</a>
        <div class="d-flex align-items-center gap-3">
            <a href="menu.html" class="nav-link text-white">Menu</a>
            <a href="cart.html" class="btn btn-warning position-relative">
                <i class="fa-solid fa-cart-shopping"></i> Cart
                <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none;">0</span>
            </a>
            <div id="navDashboardItem" style="display:none;" class="ms-2">
                <a href="#" id="navDashboardLink" class="nav-link text-warning fw-bold">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
            </div>
            <a id="navLoginBtn" class="btn btn-outline-warning btn-sm ms-2" href="login.html">Login</a>

        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-dark">📜 Your Order History</h1>
        <p class="text-muted">Review past orders, view invoices, and track live status</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-lg border-0 rounded-4 p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Order ID</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orderHistoryTable">
                            <!-- Dynamic orders -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/history.js"></script>
</body>
</html>
